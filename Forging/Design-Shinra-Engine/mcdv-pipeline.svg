<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MCDV 可替換組件管線</title>
  <desc id="desc">contract.wit 定義組件之間的契約；asset、data、game 與 render wasm 組件沿管線運作，任一組件皆可替換，只要遵守契約。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172d42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#050b14" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#70d6c3"/>
    </marker>
    <style>
      .heading { fill:#f6fbff; font:700 30px system-ui, sans-serif; }
      .sub { fill:#a9bfce; font:400 16px system-ui, sans-serif; }
      .label { fill:#e9f4f7; font:700 19px system-ui, sans-serif; }
      .small { fill:#b9ced8; font:400 14px system-ui, sans-serif; }
      .tag { fill:#70d6c3; font:700 12px system-ui, sans-serif; letter-spacing:1.2px; }
      .node { fill:#18354a; stroke:#70d6c3; stroke-width:2; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" class="heading">MCDV · Contract-driven Pipeline</text>
  <text x="600" y="94" text-anchor="middle" class="sub">穩定契約定義資料流；實作組件可自由抽換</text>

  <g filter="url(#shadow)">
    <rect x="402" y="132" width="396" height="100" rx="14" fill="#203b55" stroke="#f4be67" stroke-width="2.5"/>
    <text x="600" y="171" text-anchor="middle" class="tag" fill="#f4be67">STABLE INTERFACE</text>
    <text x="600" y="205" text-anchor="middle" class="label">contract.wit</text>
  </g>
  <path d="M600 232 V268 M160 268 H1040" stroke="#f4be67" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="1048" y="273" class="small">shared contract</text>

  <text x="70" y="326" class="tag">MCDV PIPELINE</text>
  <path d="M66 352 H1134" stroke="#70d6c3" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="382" width="220" height="142" rx="14" class="node"/>
    <text x="180" y="420" text-anchor="middle" class="label">asset.wasm</text>
    <text x="180" y="450" text-anchor="middle" class="small">assets → resources</text>
    <rect x="112" y="475" width="136" height="27" rx="13" fill="#28566a"/>
    <text x="180" y="494" text-anchor="middle" class="tag">↻ REPLACEABLE</text>

    <rect x="340" y="382" width="220" height="142" rx="14" class="node"/>
    <text x="450" y="420" text-anchor="middle" class="label">data.wasm</text>
    <text x="450" y="450" text-anchor="middle" class="small">state → data flow</text>
    <rect x="382" y="475" width="136" height="27" rx="13" fill="#28566a"/>
    <text x="450" y="494" text-anchor="middle" class="tag">↻ REPLACEABLE</text>

    <rect x="610" y="382" width="220" height="142" rx="14" class="node"/>
    <text x="720" y="420" text-anchor="middle" class="label">game.wasm</text>
    <text x="720" y="450" text-anchor="middle" class="small">logic → commands</text>
    <rect x="652" y="475" width="136" height="27" rx="13" fill="#28566a"/>
    <text x="720" y="494" text-anchor="middle" class="tag">↻ REPLACEABLE</text>

    <rect x="880" y="382" width="220" height="142" rx="14" class="node"/>
    <text x="990" y="420" text-anchor="middle" class="label">render.wasm</text>
    <text x="990" y="450" text-anchor="middle" class="small">commands → frame</text>
    <rect x="922" y="475" width="136" height="27" rx="13" fill="#28566a"/>
    <text x="990" y="494" text-anchor="middle" class="tag">↻ REPLACEABLE</text>
  </g>
  <path d="M290 453 H330 M560 453 H600 M830 453 H870" stroke="#70d6c3" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="242" y="560" width="716" height="38" rx="19" fill="#132a3a" stroke="#31576a"/>
  <text x="600" y="585" text-anchor="middle" class="small">只要遵守 contract.wit，管線中的任一 wasm 組件都能換成另一種實作。</text>
</svg>
